name: CI

# CI à la release (ci.mode = release, voir .gepet-squad.json) : les features sont validées en local par ci.commands,
# GitHub Actions ne tourne que sur la PR release/* vers main. La matrice ubuntu × windows reste : le plugin vise
# aussi Windows, et elle ne tourne qu'une fois par milestone.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Lint et tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Syntaxe de scripts/bootstrap.sh
        shell: bash
        run: bash -n scripts/bootstrap.sh
      - name: Syntaxe de scripts/vendor-three.sh
        shell: bash
        run: bash -n scripts/vendor-three.sh
      - name: Syntaxe de scripts/vendor-assets.sh
        shell: bash
        run: bash -n scripts/vendor-assets.sh
